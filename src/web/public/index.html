<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Banada Panel</title>
<style>
:root {
  --bg: #f4f2f7; --panel: #ffffff; --panel-2: #f8f6fb; --line: #e3dfea;
  --text: #1d1a22; --muted: #6c6676; --accent: #6b2fa0; --accent-ink: #fff;
  --danger: #c0392b; --ok: #1e8e4e; --warn: #b7791f; --code: #efeaf5;
  --radius: 10px; --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.04);
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #131117; --panel: #1c1922; --panel-2: #23202b; --line: #322d3c;
    --text: #ece9f1; --muted: #9a93a6; --accent: #a66be0; --accent-ink: #120d18;
    --danger: #ef6f61; --ok: #4cc382; --warn: #e3a948; --code: #2a2533;
    --shadow: none;
  }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--text);
  font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: var(--accent); }

header { display: flex; align-items: center; gap: 12px; padding: 12px 20px;
  background: var(--panel); border-bottom: 1px solid var(--line); position: sticky; top: 0; z-index: 5; flex-wrap: wrap; }
header .brand { display: flex; align-items: center; gap: 10px; font-weight: 650; }
header .brand img { width: 30px; height: 30px; border-radius: 50%; }
header .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
header .dot.on { background: var(--ok); }
nav { display: flex; gap: 4px; margin-left: auto; flex-wrap: wrap; }
nav button { background: none; border: 0; padding: 7px 12px; border-radius: 8px; cursor: pointer; color: var(--muted); }
nav button:hover { background: var(--panel-2); color: var(--text); }
nav button.active { background: var(--accent); color: var(--accent-ink); }

main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 80px; }
h2 { font-size: 18px; margin: 4px 0 14px; }
h3 { font-size: 15px; margin: 0 0 10px; }
.muted { color: var(--muted); }
.small { font-size: 12px; }
.card { background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
  padding: 16px; box-shadow: var(--shadow); margin-bottom: 14px; }
.card.inner { background: var(--panel-2); box-shadow: none; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); }
.row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.row.spread { justify-content: space-between; }
.stack > * + * { margin-top: 10px; }
.fields { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); }
label.field { display: flex; flex-direction: column; gap: 4px; font-size: 12px; color: var(--muted); }
label.field > span { font-weight: 600; }
label.check { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; }
input[type=text], input[type=number], input[type=password], select, textarea {
  background: var(--panel); border: 1px solid var(--line); border-radius: 7px; padding: 7px 9px; width: 100%; min-width: 0; }
textarea { resize: vertical; min-height: 64px; }
input:focus, select:focus, textarea:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
input[type=color] { width: 36px; height: 32px; padding: 2px; border: 1px solid var(--line); border-radius: 7px; background: var(--panel); cursor: pointer; }
input[type=range] { accent-color: var(--accent); }

.btn { border: 1px solid var(--line); background: var(--panel); padding: 7px 12px; border-radius: 8px; cursor: pointer; white-space: nowrap; }
.btn:hover { border-color: var(--accent); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
.btn.danger { color: var(--danger); }
.btn.icon { padding: 5px 9px; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.badge { display: inline-block; font-size: 11px; padding: 2px 7px; border-radius: 999px; background: var(--code); color: var(--muted); }
.badge.ok { color: var(--ok); } .badge.warn { color: var(--warn); }

table { width: 100%; border-collapse: collapse; }
th, td { text-align: left; padding: 6px 6px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: 12px; color: var(--muted); font-weight: 600; }
.opts td input[type=text] { padding: 5px 7px; }
.opts .code { width: 70px; } .opts .emoji { width: 130px; }
.scroll-x { overflow-x: auto; }

.np { display: flex; gap: 12px; align-items: center; }
.np img { width: 96px; height: 54px; object-fit: cover; border-radius: 6px; background: var(--code); }
.np .title { font-weight: 600; }
ol.up { margin: 6px 0 0; padding-left: 22px; }
ol.up li { padding: 2px 0; }

.swatch { font-weight: 700; }
.emoji-img { width: 20px; height: 20px; vertical-align: -4px; }
.log { font: 12px/1.5 ui-monospace, Consolas, monospace; background: var(--code); border-radius: 8px; padding: 10px; max-height: 240px; overflow: auto; white-space: pre-wrap; }

.preview { background: #313338; color: #dbdee1; border-radius: 8px; padding: 12px 14px; font-size: 14px; line-height: 1.4; }
.preview .msg + .msg { margin-top: 14px; padding-top: 14px; border-top: 1px solid #3f4147; }
.preview .quote { border-left: 4px solid #4e5058; padding-left: 10px; }
.preview .mention { background: rgba(88,101,242,.3); color: #c9cdfb; border-radius: 3px; padding: 0 2px; }
.preview .sub { font-size: 12px; color: #949ba4; }
.preview h4 { margin: 0; font-size: 15px; }
.preview .len { font-size: 11px; color: #949ba4; float: right; }
.preview .len.bad { color: #f23f43; font-weight: 700; }

#toast { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%); background: var(--text); color: var(--bg);
  padding: 9px 16px; border-radius: 8px; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 20; max-width: 90vw; }
#toast.show { opacity: .95; }
#toast.err { background: var(--danger); color: #fff; }

.login { max-width: 420px; margin: 12vh auto; }

/* Server tab */
.side-layout { display: grid; grid-template-columns: 230px minmax(0, 1fr); gap: 14px; align-items: start; }
.pkg-nav { position: sticky; top: 76px; display: flex; flex-direction: column; gap: 2px; }
.pkg-nav button { text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 8px; cursor: pointer; color: var(--text); display: flex; gap: 8px; align-items: center; }
.pkg-nav button:hover { background: var(--panel-2); }
.pkg-nav button.active { background: var(--accent); color: var(--accent-ink); }
.pkg-nav .cmd { font-size: 11px; opacity: .7; }
.form-grid { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
.form-grid .wide { grid-column: 1 / -1; }
.chip { display: inline-flex; gap: 4px; align-items: center; padding: 1px 7px; border-radius: 999px; background: var(--code); font-size: 12px; }
.chip.missing { color: var(--danger); }
.clip { max-width: 360px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; display: inline-block; vertical-align: bottom; }
.add-row { border-top: 1px dashed var(--line); padding-top: 12px; margin-top: 4px; }
.preview .embed { border-left: 4px solid #5865f2; background: #2b2d31; border-radius: 4px; padding: 8px 12px; margin-top: 6px; }
@media (max-width: 860px) { .side-layout { grid-template-columns: 1fr; } .pkg-nav { position: static; flex-direction: row; flex-wrap: wrap; } }
.split { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr) 380px; align-items: start; }
.sticky { position: sticky; top: 76px; }
@media (max-width: 960px) { .split { grid-template-columns: 1fr; } .sticky { position: static; } }
@media (max-width: 560px) { main { padding: 14px 16px 60px; } header { padding: 10px 16px; } }
</style>
</head>
<body>
<header id="top" hidden>
  <div class="brand"><img id="avatar" alt=""><span id="botname">Banada</span> <span id="dot" class="dot"></span></div>
  <nav id="tabs">
    <button data-tab="dashboard">Dashboard</button>
    <button data-tab="server">Server</button>
    <button data-tab="roles">Reaction roles</button>
    <button data-tab="settings">Settings</button>
    <button data-tab="commands">Commands</button>
    <button data-tab="activity">Activity</button>
  </nav>
</header>
<main id="app"></main>
<div id="toast"></div>

<script>
"use strict";

// ------------------------------------------------------------ basics
const $ = (sel, root = document) => root.querySelector(sel);
const app = $("#app");

function h(tag, props = {}, ...children) {
  const el = document.createElement(tag);
  for (const [k, v] of Object.entries(props || {})) {
    if (v == null || v === false) continue;
    if (k.startsWith("on")) el.addEventListener(k.slice(2), v);
    else if (k === "class") el.className = v;
    else if (k === "style") el.style.cssText = v;
    else if (k in el && k !== "list") el[k] = v;
    else el.setAttribute(k, v === true ? "" : v);
  }
  for (const c of children.flat(Infinity)) if (c != null && c !== false) el.append(c instanceof Node ? c : String(c));
  return el;
}

let toastTimer;
function toast(text, err = false) {
  const t = $("#toast");
  t.textContent = text;
  t.className = "show" + (err ? " err" : "");
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => (t.className = ""), err ? 5000 : 2200);
}

function storage(key, value) {
  try {
    if (value === undefined) return localStorage.getItem(key);
    if (value === null) localStorage.removeItem(key);
    else localStorage.setItem(key, value);
  } catch { return null; }
}

// ------------------------------------------------------------ api
let token = "";
{
  const m = /token=([^&]+)/.exec(location.hash);
  if (m) {
    token = decodeURIComponent(m[1]);
    storage("panelToken", token);
    history.replaceState(null, "", location.pathname);
  } else token = storage("panelToken") || "";
}

async function api(path, { method = "GET", body } = {}) {
  const res = await fetch("/api" + path, {
    method,
    headers: { Authorization: "Bearer " + token, ...(body ? { "Content-Type": "application/json" } : {}) },
    body: body ? JSON.stringify(body) : undefined,
  });
  const data = await res.json().catch(() => ({}));
  if (res.status === 401) { storage("panelToken", null); showLogin("That token was not accepted."); throw new Error("Unauthorised"); }
  if (!res.ok) throw new Error(data.error || res.statusText);
  return data;
}

async function attempt(fn, ok) {
  try { const r = await fn(); if (ok) toast(ok); return r; }
  catch (e) { if (e.message !== "Unauthorised") toast(e.message, true); }
}

// ------------------------------------------------------------ shell
let status = null;
let current = "";
let poller = null;
const views = {};

function showLogin(msg) {
  $("#top").hidden = true;
  clearInterval(poller);
  const input = h("input", { type: "password", placeholder: "Panel token", autocomplete: "current-password" });
  const go = () => { token = input.value.trim(); storage("panelToken", token); boot(); };
  app.replaceChildren(h("div", { class: "card login stack" },
    h("h2", {}, "Banada Panel"),
    h("p", { class: "muted" }, "Paste the panel token. The bot prints a ready-made link when it starts."),
    msg && h("p", { style: "color:var(--danger)" }, msg),
    input,
    h("button", { class: "btn primary", onclick: go }, "Open panel")));
  input.addEventListener("keydown", (e) => e.key === "Enter" && go());
  input.focus();
}

async function refreshStatus() {
  status = await api("/status");
  $("#dot").classList.toggle("on", status.ready);
  $("#botname").textContent = status.user?.tag ?? "Banada (offline)";
  if (status.user?.avatar) $("#avatar").src = status.user.avatar;
  return status;
}

function go(tab) {
  current = tab;
  storage("panelTab", tab);
  for (const b of $("#tabs").children) b.classList.toggle("active", b.dataset.tab === tab);
  clearInterval(poller);
  poller = null;
  app.replaceChildren(h("p", { class: "muted" }, "Loading…"));
  views[tab]().catch((e) => e.message !== "Unauthorised" && app.replaceChildren(h("div", { class: "card" }, "Could not load: " + e.message)));
}

async function boot() {
  if (!token) return showLogin();
  try { await refreshStatus(); } catch (e) { if (e.message !== "Unauthorised") showLogin(e.message); return; }
  $("#top").hidden = false;
  go(storage("panelTab") || "dashboard");
}
$("#tabs").addEventListener("click", (e) => e.target.dataset.tab && go(e.target.dataset.tab));

const fmtUptime = (ms) => {
  const s = Math.floor(ms / 1000), d = Math.floor(s / 86400), hh = Math.floor(s % 86400 / 3600), m = Math.floor(s % 3600 / 60);
  return (d ? d + "d " : "") + hh + "h " + m + "m";
};

// ------------------------------------------------------------ dashboard
views.dashboard = async () => {
  const draw = () => {
    if (document.activeElement?.type === "range") return; // don't fight a slider drag
    const s = status;
    app.replaceChildren(
      h("h2", {}, "Dashboard"),
      h("div", { class: "grid", style: "margin-bottom:14px" },
        h("div", { class: "card" }, h("div", { class: "muted small" }, "Status"), h("div", { style: "font-size:20px;font-weight:650" }, s.ready ? "Online" : "Offline")),
        h("div", { class: "card" }, h("div", { class: "muted small" }, "Uptime · ping · memory"),
          h("div", { style: "font-size:20px;font-weight:650" }, `${fmtUptime(s.uptimeMs)} · ${s.ping} ms · ${s.memoryMb} MB`))),
      s.guilds.length ? s.guilds.map(guildCard) : h("div", { class: "card muted" }, "The bot is not in any server yet."));
  };

  const music = (guildId, action, body) =>
    attempt(async () => { await api(`/music/${guildId}/${action}`, { method: "POST", body }); await refreshStatus(); draw(); });

  function guildCard(g) {
    const q = g.queue;
    const head = h("div", { class: "row spread" },
      h("div", { class: "row" }, g.icon && h("img", { src: g.icon, style: "width:28px;height:28px;border-radius:50%" }), h("h3", { style: "margin:0" }, g.name)),
      h("div", { class: "row" },
        h("span", { class: "badge" }, g.members + " members"),
        h("span", { class: "badge " + (g.features.gradients ? "ok" : "") }, "Gradients " + (g.features.gradients ? "✓" : "✗")),
        h("span", { class: "badge " + (g.features.roleIcons ? "ok" : "") }, "Role icons " + (g.features.roleIcons ? "✓" : "✗"))));
    if (!q) return h("div", { class: "card" }, head, h("p", { class: "muted", style: "margin:10px 0 0" }, "Nothing playing."));

    const vol = h("input", { type: "range", min: 0, max: 200, step: 5, value: q.volume, style: "width:160px",
      onchange: (e) => music(g.id, "volume", { volume: Number(e.target.value) }) });
    return h("div", { class: "card stack" }, head,
      h("div", { class: "np" },
        q.current?.thumbnail && h("img", { src: q.current.thumbnail, alt: "" }),
        h("div", {},
          h("div", { class: "muted small" }, (q.paused ? "⏸ Paused" : "▶ Playing") + ` in ${q.voiceChannel ?? "?"} · ${q.currentTime} / ${q.current?.duration ?? "?"}`),
          h("div", { class: "title" }, q.current?.url ? h("a", { href: q.current.url, target: "_blank", rel: "noopener" }, q.current.name) : q.current?.name),
          q.current?.user && h("div", { class: "muted small" }, "Requested by " + q.current.user))),
      h("div", { class: "row" },
        h("button", { class: "btn icon", title: "Previous", onclick: () => music(g.id, "previous") }, "⏮"),
        h("button", { class: "btn icon", title: "Play / pause", onclick: () => music(g.id, "toggle") }, q.paused ? "▶" : "⏸"),
        h("button", { class: "btn icon", title: "Skip", onclick: () => music(g.id, "skip") }, "⏭"),
        h("button", { class: "btn icon danger", title: "Stop", onclick: () => confirm("Stop playback and clear the queue?") && music(g.id, "stop") }, "⏹"),
        h("button", { class: "btn icon", title: "Shuffle", onclick: () => music(g.id, "shuffle") }, "🔀"),
        h("button", { class: "btn", title: "Loop", onclick: () => music(g.id, "loop") }, "🔁 " + q.repeatMode),
        h("button", { class: "btn" + (q.autoplay ? " primary" : ""), onclick: () => music(g.id, "autoplay") }, "Autoplay " + (q.autoplay ? "on" : "off")),
        h("span", { class: "row", style: "margin-left:auto" }, "🔊", vol, h("span", { class: "small muted" }, q.volume + "%"))),
      q.upcoming.length
        ? h("div", {}, h("div", { class: "muted small" }, `Up next · ${q.length - 1} song(s) · ${q.totalDuration} total`),
            h("ol", { class: "up" }, q.upcoming.map((s, i) => h("li", {},
              s.name, " ", h("span", { class: "muted small" }, s.duration), " ",
              h("button", { class: "btn icon small", title: "Remove", onclick: () => music(g.id, "remove", { index: i + 1 }) }, "✕")))))
        : h("div", { class: "muted small" }, q.autoplay ? "Queue empty, autoplay will pick the next song." : "Queue empty."));
  }

  draw();
  poller = setInterval(() => refreshStatus().then(() => current === "dashboard" && draw()).catch(() => {}), 5000);
};

// ------------------------------------------------------------ settings
views.settings = async () => {
  const s = await api("/settings");
  const channelOpts = await channelOptions(s.commandsChannelId);

  const f = {
    colour: h("input", { type: "color", value: "#" + s.colour }),
    defaultVolume: h("input", { type: "number", min: 0, max: 200, value: s.defaultVolume }),
    leaveOnEmpty: h("input", { type: "checkbox", checked: s.leaveOnEmpty }),
    leaveOnEmptyMin: h("input", { type: "number", min: 0, step: 1, value: Math.round(s.leaveOnEmptyTime / 60000) }),
    leaveOnFinish: h("input", { type: "checkbox", checked: s.leaveOnFinish }),
    leaveOnStop: h("input", { type: "checkbox", checked: s.leaveOnStop }),
    commandListEnabled: h("input", { type: "checkbox", checked: s.commandListEnabled }),
    commandsChannelId: h("select", {}, channelOpts),
    presenceIntervalSec: h("input", { type: "number", min: 15, value: s.presenceIntervalSec }),
    activities: h("textarea", { rows: 7, value: s.activities.join("\n") }),
  };

  const save = () => attempt(() => api("/settings", { method: "PUT", body: {
    colour: f.colour.value.slice(1),
    defaultVolume: Number(f.defaultVolume.value),
    leaveOnEmpty: f.leaveOnEmpty.checked,
    leaveOnEmptyTime: Number(f.leaveOnEmptyMin.value) * 60000,
    leaveOnFinish: f.leaveOnFinish.checked,
    leaveOnStop: f.leaveOnStop.checked,
    commandListEnabled: f.commandListEnabled.checked,
    commandsChannelId: f.commandsChannelId.value,
    presenceIntervalSec: Number(f.presenceIntervalSec.value),
    activities: f.activities.value.split("\n"),
  } }), "Settings saved and applied.");

  app.replaceChildren(
    h("h2", {}, "Bot-wide settings"),
    h("p", { class: "muted" }, "Defaults for every server. Each server can override colour, volume, the leave options and the command list under Server → Bot settings. The rotating status is bot-wide by nature (one status for the whole bot)."),
    h("div", { class: "card stack" }, h("h3", {}, "Look & playback"),
      h("div", { class: "fields" },
        h("label", { class: "field" }, h("span", {}, "Embed / player colour"), f.colour),
        h("label", { class: "field" }, h("span", {}, "Default volume for new queues (%)"), f.defaultVolume))),
    h("div", { class: "card stack" }, h("h3", {}, "Leaving the voice channel"),
      h("label", { class: "check" }, f.leaveOnEmpty, "Leave when nobody is listening, after"),
      h("label", { class: "field", style: "max-width:240px" }, h("span", {}, "Minutes (max ≈ 35 791)"), f.leaveOnEmptyMin),
      h("label", { class: "check" }, f.leaveOnFinish, "Leave when the queue finishes"),
      h("label", { class: "check" }, f.leaveOnStop, "Leave on /stop or the stop button")),
    h("div", { class: "card stack" }, h("h3", {}, "Status & command list"),
      h("div", { class: "fields" },
        h("label", { class: "field" }, h("span", {}, "Change status every (seconds)"), f.presenceIntervalSec),
        h("label", { class: "field" }, h("span", {}, "Command list channel"), f.commandsChannelId)),
      h("label", { class: "check" }, f.commandListEnabled, "Post the command list on startup and once a day"),
      h("label", { class: "field" }, h("span", {}, "Custom statuses (one per line, picked at random)"), f.activities)),
    h("div", { class: "row" },
      h("button", { class: "btn primary", onclick: save }, "Save settings"),
      h("button", { class: "btn", onclick: () => attempt(() => api("/commands/post-list", { method: "POST" }), "Command list posted.") }, "Post command list now")));
};

async function channelOptions(selected) {
  const opts = [h("option", { value: "" }, "— none —")];
  for (const g of status.guilds) {
    const chans = await api(`/guilds/${g.id}/channels`).catch(() => []);
    opts.push(h("optgroup", { label: g.name }, chans.map((c) => h("option", { value: c.id, selected: c.id === selected }, "#" + c.name))));
  }
  return opts;
}

// ------------------------------------------------------------ commands
views.commands = async () => {
  const cmds = await api("/commands");
  app.replaceChildren(h("h2", {}, "Commands"),
    h("div", { class: "card scroll-x" }, h("table", {},
      h("tr", {}, h("th", {}, "Command"), h("th", {}, "Description"), h("th", {}, "Options")),
      cmds.sort((a, b) => a.name.localeCompare(b.name)).map((c) =>
        h("tr", {}, h("td", {}, h("code", {}, "/" + c.name)), h("td", {}, c.description), h("td", { class: "muted small" }, c.options.join(", ")))))),
    h("p", { class: "muted small" }, "After changing command definitions in code, run npm run deploy."));
};

// ------------------------------------------------------------ activity
views.activity = async () => {
  const draw = (items) => app.replaceChildren(h("h2", {}, "Reaction role activity"),
    h("div", { class: "card" }, items.length
      ? h("table", {}, items.map((a) => h("tr", {}, h("td", { class: "muted small", style: "white-space:nowrap" }, new Date(a.time).toLocaleString()), h("td", {}, a.text))))
      : h("p", { class: "muted", style: "margin:0" }, "Nothing yet. Picks and swaps appear here while the bot runs.")));
  draw(await api("/reaction-roles/activity"));
  poller = setInterval(() => api("/reaction-roles/activity").then((a) => current === "activity" && draw(a)).catch(() => {}), 5000);
};

// ------------------------------------------------------------ reaction roles
views.roles = async () => {
  // One board per server: start with the server last used in the panel.
  let startGuild = storage("panelGuild");
  if (!status.guilds.some((g) => g.id === startGuild)) startGuild = status.guilds[0]?.id;
  if (!startGuild) return app.replaceChildren(h("div", { class: "card muted" }, "The bot is not in any server yet."));

        h("optgroup", { label: "Channels" }, ref.channels.filter((c) => c.kind !== "category").map((c) => h("option", { value: c.id }, "#" + c.name))),
        h("optgroup", { label: "Roles" }, ref.roles.map((r) => h("option", { value: r.id }, "@" + r.name))));
      el = h("div", { class: "row", style: "flex-wrap:nowrap" }, input, pick);
      get = () => input.value.trim(); set = (v) => (input.value = v ?? "");
    } else if (t === "member") {
      // Type a name: matching server members are suggested; the stored value is their ID.
      const id = "dm-" + Math.random().toString(36).slice(2);
      const input = h("input", { type: "text", list: id, placeholder: "Search a member by name or paste an ID" });
      const list = h("datalist", { id });
      let timer;
      input.addEventListener("input", () => {
        clearTimeout(timer);
        const q = input.value.trim();
        if (q.length < 2 || /^\d{15,25}$/.test(q)) return;
        timer = setTimeout(async () => {
          const found = await api(`/guilds/${guildId}/members?q=${encodeURIComponent(q)}`).catch(() => []);
          list.replaceChildren(...found.map((m) => h("option", { value: m.id }, `${m.name} (@${m.username})`)));
        }, 300);
      });
      el = h("span", {}, input, list);
      get = () => input.value.trim(); set = (v) => (input.value = v ?? "");
    } else if (t === "script") {
      const ta = h("textarea", { rows: 4, placeholder: "Plain text, or a JSON script starting with {\"" });
      const out = h("div");
      const preview = h("button", { class: "btn small", type: "button", onclick: () => attempt(async () => {
        const p = await api(`/guilds/${guildId}/script-preview`, { method: "POST", body: { script: ta.value } });
        out.replaceChildren(h("div", { class: "preview", style: "margin-top:8px" },
          p.content && h("div", {}, p.content),
          p.embeds.map((e) => h("div", { class: "embed", style: e.color != null ? `border-left-color:#${e.color.toString(16).padStart(6, "0")}` : "" },
            e.title && h("h4", {}, e.title), e.description && h("div", {}, e.description),
            (e.fields ?? []).map((f) => h("div", {}, h("b", {}, f.name), " ", f.value)),
            e.image?.url && h("div", { class: "sub" }, "🖼 " + e.image.url))),
          p.buttons.map((b) => h("span", { class: "chip" }, "🔗 " + b.label))));
      }) }, "Preview");
      el = h("div", {}, ta, h("div", { class: "row", style: "margin-top:4px" }, preview, h("span", { class: "small muted" }, "Variables: {user.mention} {user.name} {guild.name} {guild.count} …")), out);
      get = () => ta.value; set = (v) => (ta.value = v ?? "");
      return { el, get, set, wide: true };
    } else if (t === "emoji") {
      const input = h("input", { type: "text", placeholder: "⭐ or <:name:id>" });
      const pick = ref.emojis.length && h("select", { style: "max-width:90px", onchange: (e) => { if (e.target.value) input.value = e.target.value; e.target.value = ""; } },
        h("option", { value: "" }, "server…"), ref.emojis.map((e) => h("option", { value: e.text }, ":" + e.name + ":")));
      el = h("div", { class: "row", style: "flex-wrap:nowrap" }, input, pick);
      get = () => input.value.trim(); set = (v) => (input.value = v ?? "");
    } else if (t === "colour") {
      const c = h("input", { type: "color", value: "#5865f2" });
      const use = h("input", { type: "checkbox" });
      el = h("div", { class: "row" }, c, field.optional && h("label", { class: "check small" }, use, "custom"));
      get = () => (field.optional && !use.checked ? null : c.value); set = (v) => { use.checked = Boolean(v); if (v) c.value = v.toLowerCase(); };
    } else if (t === "readonly") {
      el = h("div", { class: "muted" }); get = () => undefined;
      set = (v) => (el.textContent = v == null ? "—" : field.format === "time" ? fmtTime(v) : String(v));
    } else {
      el = h("input", { type: t === "int" || t === "number" ? "number" : "text", step: t === "number" ? "0.05" : "1", min: field.min, max: field.max,
        placeholder: t === "duration" ? "10m, 1h30m, 2d" : field.optional ? "(optional)" : "" });
    }
    get ??= () => (el.value === "" ? null : el.value);
    set ??= (v) => (el.value = v ?? "");
    return { el, get, set };
  }

  const fieldBox = (field, w) => w.inline ? h("div", { class: w.wide ? "wide" : "" }, w.el)
    : h("label", { class: "field" + (w.wide ? " wide" : "") }, h("span", {}, field.label, field.optional ? "" : " *"), w.el);

  // ---- section renderers
  function formSection(pkg, section, index, data) {
    const widgets = section.fields.map((f) => [f, widget(f)]);
    for (const [f, w] of widgets) w.set(data.values?.[f.name]);
    const save = () => attempt(async () => {
      const values = {};
      for (const [f, w] of widgets) if (f.type !== "readonly") values[f.name] = w.get();
      const r = await api(`/guilds/${guildId}/panel/${pkg.id}/${index}`, { method: "PUT", body: { values } });
      toast(r.warning || "Saved.", Boolean(r.warning));
      await drawPackage();
    });
    return h("div", { class: "card stack" },
      h("h3", {}, section.title), section.help && h("p", { class: "muted small", style: "margin:0" }, section.help),
      h("div", { class: "form-grid" }, widgets.map(([f, w]) => fieldBox(f, w))),
      h("div", {}, h("button", { class: "btn primary", onclick: save }, "Save")));
  }

  function listSection(pkg, section, index, data) {
    const widgets = section.fields.map((f) => [f, widget(f)]);
    const add = () => attempt(async () => {
      const values = {};
      for (const [f, w] of widgets) values[f.name] = w.get();
      const r = await api(`/guilds/${guildId}/panel/${pkg.id}/${index}/rows`, { method: "POST", body: { values } });
      toast(r.warning || "Saved.", Boolean(r.warning));
      await drawPackage();
    });
    const remove = (row) => attempt(async () => {
      if (!confirm("Remove this entry?")) return;
      const r = await api(`/guilds/${guildId}/panel/${pkg.id}/${index}/delete`, { method: "POST", body: { key: row._key } });
      toast(r.warning || "Removed.", Boolean(r.warning));
      await drawPackage();
    });
    const edit = (row) => { for (const [f, w] of widgets) w.set(row[f.name]); addBox.scrollIntoView({ behavior: "smooth", block: "center" }); };
    const addBox = h("div", { class: "add-row stack" },
      h("div", { class: "form-grid" }, widgets.map(([f, w]) => fieldBox(f, w))),
      h("div", { class: "row" }, h("button", { class: "btn primary", onclick: add }, "Add / update"),
        h("span", { class: "small muted" }, "An entry with the same key is updated.")));
    return h("div", { class: "card stack" },
      h("div", { class: "row spread" }, h("h3", { style: "margin:0" }, section.title), h("span", { class: "badge" }, data.rows.length + " entr" + (data.rows.length === 1 ? "y" : "ies"))),
      section.help && h("p", { class: "muted small", style: "margin:0" }, section.help),
      data.rows.length
        ? h("div", { class: "scroll-x" }, h("table", {},
            h("tr", {}, section.fields.map((f) => h("th", {}, f.label)), h("th", {})),
            data.rows.map((row) => h("tr", {},
              section.fields.map((f) => h("td", {}, cell(row[f.name], f.type, data.labels))),
              h("td", { style: "white-space:nowrap" },
                h("button", { class: "btn icon", title: "Edit", onclick: () => edit(row) }, "✎"),
                h("button", { class: "btn icon danger", title: "Remove", onclick: () => remove(row) }, "✕"))))))
        : h("p", { class: "muted", style: "margin:0" }, "Nothing here yet."),
      addBox);
  }

  function viewSection(pkg, section, index, data) {
    const remove = (row) => attempt(async () => {
      if (!confirm("Remove this entry?")) return;
      await api(`/guilds/${guildId}/panel/${pkg.id}/${index}/delete`, { method: "POST", body: { key: row._key } });
      toast("Removed.");
      await drawPackage();
    });
    return h("div", { class: "card stack" },
      h("div", { class: "row spread" }, h("h3", { style: "margin:0" }, section.title), h("span", { class: "badge" }, data.rows.length)),
      data.rows.length
        ? h("div", { class: "scroll-x" }, h("table", {},
            h("tr", {}, section.columns.map((c) => h("th", {}, c.label)), section.removable && h("th", {})),
            data.rows.map((row) => h("tr", {},
              section.columns.map((c) => h("td", {}, cell(row[c.col], c.type, data.labels))),
              section.removable && h("td", {}, h("button", { class: "btn icon danger", title: "Remove", onclick: () => remove(row) }, "✕"))))))
        : h("p", { class: "muted", style: "margin:0" }, "Nothing yet."));
  }

  function oauthSection(section) {
    const box = h("div", { class: "card stack" }, h("h3", {}, section.title), h("p", { class: "muted small" }, "Loading…"));
    (async () => {
      const st = await api(`/guilds/${guildId}/oauth`);
      const act = (path, ok) => attempt(async () => {
        const r = await api(`/guilds/${guildId}/oauth/${path}`, { method: "POST" });
        if (r.url) { window.open(r.url, "_blank", "noopener"); toast("Authorize in the Discord tab, then come back and refresh."); return; }
        toast(r.error || r.summary || ok, Boolean(r.error));
        box.replaceWith(oauthSection(section));
      });
      const explain = h("p", { class: "muted small", style: "margin:0" },
        "Discord hides staff commands from members without Manage Messages / Manage Server. A server admin can connect once, " +
        "and the bot will then keep this server's command menu in step with the lists below: moderator commands become visible " +
        "to your moderator roles/users, admin commands to your admins, and commands you lowered to Members to everyone.");
      if (!st.configured) {
        box.replaceChildren(h("h3", {}, section.title), explain,
          h("div", { class: "log" }, [
            "Setup (one time):",
            "1. Developer Portal → your app → OAuth2: copy the Client Secret into src/config.json as \"CLIENT_SECRET\".",
            "2. Under OAuth2 → Redirects, add:  " + st.redirectUri,
            "   (if you open the panel from another address, set \"PANEL_URL\" in config.json to it)",
            "3. Restart the bot, then come back here and press Connect.",
          ].join("\n")));
        return;
      }
      box.replaceChildren(h("h3", {}, section.title), explain,
        h("div", { class: "row" },
          st.connected
            ? h("span", { class: "badge ok" }, `Connected as ${st.user ?? "?"}`)
            : h("span", { class: "badge warn" }, "Not connected"),
          st.lastSyncAt && h("span", { class: "small muted" }, "Last sync " + new Date(st.lastSyncAt).toLocaleString()),
          st.lastError && h("span", { class: "small", style: "color:var(--danger)" }, st.lastError)),
        h("div", { class: "row" },
          h("button", { class: "btn primary", onclick: () => act("start") }, st.connected ? "Reconnect" : "Connect Discord"),
          st.connected && h("button", { class: "btn", onclick: () => act("sync", "Synced.") }, "Sync now"),
          st.connected && h("button", { class: "btn danger", onclick: () => confirm("Stop syncing this server's command menu? (Existing settings stay until changed in Discord.)") && act("disconnect", "Disconnected.") }, "Disconnect")),
        h("p", { class: "small muted", style: "margin:0" }, "The person who connects needs Manage Server and Manage Roles here. Changes below re-sync automatically."));
    })().catch((e) => box.replaceChildren(h("h3", {}, section.title), h("p", { style: "color:var(--danger)" }, e.message)));
    return box;
  }

  function noteSection(section) {
    return h("div", { class: "card" }, h("h3", {}, section.title), h("p", { class: "muted", style: "margin:0" }, section.help));
  }

  const LEVEL_LABEL = { member: "Members", mod: "Moderators", admin: "Admins", owner: "Owner", mixed: "Mixed" };
  function levelSelect(path, current, fallback, onSaved) {
    const sel = h("select", { style: "width:auto" },
      h("option", { value: "" }, `Default (${LEVEL_LABEL[fallback] ?? fallback})`),
      ["member", "mod", "admin", "owner"].map((l) => h("option", { value: l, selected: l === current }, LEVEL_LABEL[l])));
    sel.addEventListener("change", () => attempt(async () => {
      await api(`/guilds/${guildId}/command-levels`, { method: "PUT", body: { command: path, level: sel.value } });
      toast(`/${path}: ${sel.value ? LEVEL_LABEL[sel.value] : "default"}`);
      onSaved?.();
    }));
    return sel;
  }

  function commandLevelsSection(section, data) {
    const filter = h("input", { type: "text", placeholder: "Filter commands…", style: "max-width:260px" });
    const body = h("div", { class: "stack" });
    const draw = () => {
      const q = filter.value.trim().toLowerCase();
      const groups = new Map();
      for (const c of data.commands) {
        if (q && !c.name.includes(q) && !c.subs.some((s) => s.path.includes(q))) continue;
        if (!groups.has(c.package)) groups.set(c.package, []);
        groups.get(c.package).push(c);
      }
      body.replaceChildren(...[...groups].map(([pkg, cmds]) => h("div", {},
        h("div", { class: "small muted", style: "text-transform:uppercase;letter-spacing:.05em;margin:6px 0" }, pkg),
        h("table", {}, cmds.map((c) => {
          const subRows = c.subs.map((s) => h("tr", { class: "sub", hidden: !q },
            h("td", { style: "padding-left:28px" }, h("code", {}, "/" + s.path)),
            h("td", { class: "muted small" }, ""),
            h("td", {}, levelSelect(s.path, s.override, c.override ? `${LEVEL_LABEL[c.override]} via /${c.name}` : s.default))));
          const toggle = c.subs.length && h("button", { class: "btn icon small", title: "Subcommands", onclick: () => subRows.forEach((r) => (r.hidden = !r.hidden)) }, `▸ ${c.subs.length}`);
          return [
            h("tr", {},
              h("td", {}, h("code", {}, "/" + c.name), " ", toggle),
              h("td", { class: "muted small" }, c.description),
              h("td", {}, levelSelect(c.name, c.override, c.default, () => drawPackage()))),
            ...subRows,
          ];
        }).flat()))));
    };
    filter.addEventListener("input", draw);
    draw();
    return h("div", { class: "card stack" },
      h("div", { class: "row spread" }, h("h3", { style: "margin:0" }, section.title), filter),
      section.help && h("p", { class: "muted small", style: "margin:0" }, section.help),
      body);
  }

  // ---- page
  const body = h("div");
  const nav = h("div", { class: "pkg-nav" });

  async function drawPackage() {
    const pkg = schema.find((p) => p.id === pkgId);
    for (const b of nav.children) b.classList.toggle("active", b.dataset.id === pkgId);
    const data = await api(`/guilds/${guildId}/panel/${pkg.id}`);
    body.replaceChildren(
      h("div", { class: "row spread", style: "margin-bottom:10px" },
        h("h2", { style: "margin:0" }, pkg.icon + " " + pkg.title),
        h("span", { class: "small muted" }, "Also in Discord: ", h("code", {}, pkg.command))),
      ...pkg.sections.map((s, i) =>
        s.kind === "note" ? noteSection(s)
        : s.kind === "oauth" ? oauthSection(s)
        : s.kind === "commandLevels" ? commandLevelsSection(s, data.sections[i])
        : s.kind === "list" ? listSection(pkg, s, i, data.sections[i])
        : s.kind === "view" ? viewSection(pkg, s, i, data.sections[i])
        : formSection(pkg, s, i, data.sections[i])));
  }

  nav.append(...schema.map((p) => h("button", { "data-id": p.id, onclick: () => attempt(async () => { pkgId = p.id; storage("panelPkg", pkgId); await drawPackage(); }) },
    h("span", {}, p.icon), h("span", {}, h("div", {}, p.title), h("div", { class: "cmd" }, p.command)))));

  const guildSel = h("select", { style: "max-width:280px", onchange: (e) => attempt(async () => {
    guildId = e.target.value; storage("panelGuild", guildId); await loadRefs(); await drawPackage();
  }) }, status.guilds.map((g) => h("option", { value: g.id, selected: g.id === guildId }, g.name)));

  await loadRefs();
  app.replaceChildren(
    h("div", { class: "row spread", style: "margin-bottom:14px" }, h("h2", { style: "margin:0" }, "Server settings"), h("label", { class: "row" }, h("span", { class: "muted small" }, "Server"), guildSel)),
    h("div", { class: "side-layout" }, nav, body));
  await drawPackage();
};

boot();
</script>
</body>
</html>
